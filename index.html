<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VentaFácil Fotos</title><style>body{font:16px system-ui;background:#f5f6f8;color:#182230;margin:0}main{max-width:750px;margin:auto;padding:24px 16px}h1{margin-bottom:5px}.muted{color:#667085}.panel{background:white;border:1px solid #e4e7ec;border-radius:16px;padding:20px;margin:18px 0}.upload{display:block;border:2px dashed #b8c4d4;padding:30px 10px;text-align:center;border-radius:12px;cursor:pointer}input{display:none}button,a.download{display:inline-block;background:#203c60;color:white;border:0;border-radius:10px;padding:13px 17px;font:inherit;text-decoration:none;margin:12px 6px 0 0}button:disabled{opacity:.4}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair img{width:100%;border-radius:9px}.item{border-top:1px solid #ddd;margin-top:20px;padding-top:15px}small{color:#667085}</style></head><body><main><h1>VentaFácil Fotos</h1><p class="muted">Mejora fotográfica natural, sin regenerar el artículo ni cambiar el fondo.</p><section class="panel"><label class="upload" for="photos">📷 Seleccionar fotografías<br><small>Puedes elegir varias</small></label><input id="photos" type="file" accept="image/*" multiple><p id="selected" class="muted">Ninguna fotografía seleccionada.</p><button id="process" disabled>Mejorar fotografías</button><button id="reset" style="background:#667085">Limpiar</button><p id="status" aria-live="polite"></p></section><section id="results" class="panel" hidden></section><p class="muted"><small>Todo el procesamiento se realiza en tu dispositivo. Se conserva el encuadre y no se inventan ni eliminan elementos.</small></p></main><script>
const input=document.querySelector('#photos'),go=document.querySelector('#process'),out=document.querySelector('#results'),status=document.querySelector('#status'),selected=document.querySelector('#selected');let urls=[];
function clear(){urls.forEach(URL.revokeObjectURL);urls=[];out.replaceChildren();out.hidden=true;status.textContent=''}
input.onchange=()=>{clear();selected.textContent=input.files.length+' fotografía(s) seleccionada(s)';go.disabled=!input.files.length};
document.querySelector('#reset').onclick=()=>{input.value='';clear();selected.textContent='Ninguna fotografía seleccionada.';go.disabled=true};
const clip=x=>Math.max(0,Math.min(255,x));
async function openPhoto(file){const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();return img}finally{URL.revokeObjectURL(url)}}
go.onclick=async()=>{clear();go.disabled=true;out.hidden=false;let done=0;const files=[...input.files];for(let n=0;n<files.length;n++){const file=files[n];status.textContent='Procesando '+(n+1)+' de '+files.length;try{const img=await openPhoto(file),scale=Math.min(1,2400/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);const data=ctx.getImageData(0,0,w,h),d=data.data;let sum=0,samples=0;for(let i=0;i<d.length;i+=64){sum+=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;samples++}const exposure=Math.max(-8,Math.min(10,(.52-sum/samples)*23));for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],lum=(r*.2126+g*.7152+b*.0722)/255,boost=exposure+9*(1-lum)**2,avg=(r+g+b)/3;d[i]=clip(((avg+(r-avg)*1.025+boost)-127.5)*1.025+127.5);d[i+1]=clip(((avg+(g-avg)*1.025+boost)-127.5)*1.025+127.5);d[i+2]=clip(((avg+(b-avg)*1.025+boost)-127.5)*1.025+127.5)}ctx.putImageData(data,0,0);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.92));if(!blob)throw Error('Exportación no disponible');const orig=URL.createObjectURL(file),edit=URL.createObjectURL(blob);urls.push(orig,edit);const card=document.createElement('div');card.className='item';const title=document.createElement('h3');title.textContent=file.name;card.append(title);const pair=document.createElement('div');pair.className='pair';for(const [label,src] of [['Original',orig],['Mejorada',edit]]){const box=document.createElement('div'),text=document.createElement('small'),image=document.createElement('img');text.textContent=label;image.src=src;image.alt=label;box.append(text,image);pair.append(box)}card.append(pair);const link=document.createElement('a');link.className='download';link.href=edit;link.download='ventafacil-'+(n+1)+'.jpg';link.textContent='Descargar mejorada';card.append(link);out.append(card);done++}catch(err){const p=document.createElement('p');p.textContent='Error en '+file.name+': '+err.message;out.append(p)}}status.textContent=done+' de '+files.length+' procesadas';go.disabled=false};
</script></body></html>
