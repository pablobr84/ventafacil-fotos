<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VentaFácil Fotos</title><style>body{font:16px system-ui;background:#f5f6f8;color:#182230;margin:0}main{max-width:750px;margin:auto;padding:24px 16px}h1{margin-bottom:5px}.muted{color:#667085}.panel{background:white;border:1px solid #e4e7ec;border-radius:16px;padding:20px;margin:18px 0}.upload{display:block;border:2px dashed #b8c4d4;padding:30px 10px;text-align:center;border-radius:12px;cursor:pointer}input{display:none}button,a.download{display:inline-block;background:#203c60;color:white;border:0;border-radius:10px;padding:13px 17px;font:inherit;text-decoration:none;margin:12px 6px 0 0}button:disabled{opacity:.4}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair img{width:100%;border-radius:9px}.item{border-top:1px solid #ddd;margin-top:20px;padding-top:15px}small{color:#667085}</style></head><body><main><h1>VentaFácil Fotos</h1><p class="muted">Mejora fotográfica natural v2: iluminación, sombras y color sin regenerar el artículo ni cambiar el fondo.</p><section class="panel"><label class="upload" for="photos">📷 Seleccionar fotografías<br><small>Puedes elegir varias</small></label><input id="photos" type="file" accept="image/*" multiple><p id="selected" class="muted">Ninguna fotografía seleccionada.</p><button id="process" disabled>Mejorar fotografías</button><button id="reset" style="background:#667085">Limpiar</button><p id="status" aria-live="polite"></p></section><section id="results" class="panel" hidden></section><p class="muted"><small>Todo el procesamiento se realiza en tu dispositivo. Se conserva el encuadre y no se inventan ni eliminan elementos.</small></p></main><script>
const input=document.querySelector('#photos'),go=document.querySelector('#process'),out=document.querySelector('#results'),status=document.querySelector('#status'),selected=document.querySelector('#selected');let urls=[];
function clear(){urls.forEach(URL.revokeObjectURL);urls=[];out.replaceChildren();out.hidden=true;status.textContent=''}
input.onchange=()=>{clear();selected.textContent=input.files.length+' fotografía(s) seleccionada(s)';go.disabled=!input.files.length};
document.querySelector('#reset').onclick=()=>{input.value='';clear();selected.textContent='Ninguna fotografía seleccionada.';go.disabled=true};
const clip=x=>Math.max(0,Math.min(255,x));
async function openPhoto(file){const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();return img}finally{URL.revokeObjectURL(url)}}
go.onclick=async()=>{clear();go.disabled=true;out.hidden=false;let done=0;const files=[...input.files];for(let n=0;n<files.length;n++){const file=files[n];status.textContent='Procesando '+(n+1)+' de '+files.length;try{const img=await openPhoto(file),scale=Math.min(1,2400/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);const data=ctx.getImageData(0,0,w,h),d=data.data;
// Corrección local de luminancia mediante mapa de iluminación suavizado.
// Se preserva el color y la geometría de cada píxel original.
const sw=Math.max(16,Math.min(180,Math.round(w/12))),sh=Math.max(16,Math.round(h*sw/w));
const tiny=document.createElement('canvas');tiny.width=sw;tiny.height=sh;
const tctx=tiny.getContext('2d',{willReadFrequently:true});tctx.drawImage(canvas,0,0,sw,sh);
const sd=tctx.getImageData(0,0,sw,sh).data,light=new Float32Array(sw*sh);
let sum=0;const histogram=new Uint32Array(256);
for(let i=0;i<d.length;i+=4){const l=Math.round(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2]);histogram[l]++;sum+=l}
const mean=sum/(w*h)/255;
let acc=0,p05=0,p95=255;for(let i=0;i<256;i++){acc+=histogram[i];if(acc>=w*h*.05&&p05===0)p05=i;if(acc>=w*h*.95){p95=i;break}}
for(let i=0;i<sw*sh;i++)light[i]=(.2126*sd[i*4]+.7152*sd[i*4+1]+.0722*sd[i*4+2])/255;
// Box blur integral: illumination changes only at broad spatial scales.
const radius=Math.max(2,Math.round(sw*.075)),integral=new Float64Array((sw+1)*(sh+1));
for(let y=1;y<=sh;y++){let row=0;for(let x=1;x<=sw;x++){row+=light[(y-1)*sw+x-1];integral[y*(sw+1)+x]=integral[(y-1)*(sw+1)+x]+row}}
const smooth=new Float32Array(sw*sh);
for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){const x0=Math.max(0,x-radius),x1=Math.min(sw-1,x+radius),y0=Math.max(0,y-radius),y1=Math.min(sh-1,y+radius);smooth[y*sw+x]=(integral[(y1+1)*(sw+1)+x1+1]-integral[y0*(sw+1)+x1+1]-integral[(y1+1)*(sw+1)+x0]+integral[y0*(sw+1)+x0])/((x1-x0+1)*(y1-y0+1))}
const globalEV=Math.max(-.12,Math.min(.35,(.57-mean)*.85));
const range=Math.max(100,p95-p05),stretch=Math.min(1.12,215/range);
for(let y=0;y<h;y++){const yy=Math.min(sh-1,Math.floor(y*sh/h));for(let x=0;x<w;x++){const i=(y*w+x)*4,xx=Math.min(sw-1,Math.floor(x*sw/w)),illum=smooth[yy*sw+xx];const r=d[i],g=d[i+1],b=d[i+2],lum=(.2126*r+.7152*g+.0722*b)/255;
// Shadows receive local lift; highlights are protected.
const local=Math.min(.34,Math.max(0,(.55-illum)*.60));
const shadowWeight=Math.pow(1-lum,1.6);
const lift=(globalEV*.50+local)*shadowWeight*255;
const factor=1+(stretch-1)*.65;
let rr=(r-125)*factor+125+lift,gg=(g-125)*factor+125+lift,bb=(b-125)*factor+125+lift;
const avg=(rr+gg+bb)/3,sat=1.095;
rr=avg+(rr-avg)*sat;gg=avg+(gg-avg)*sat;bb=avg+(bb-avg)*sat;
d[i]=clip(rr);d[i+1]=clip(gg);d[i+2]=clip(bb);
}}
ctx.putImageData(data,0,0);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.92));if(!blob)throw Error('Exportación no disponible');const orig=URL.createObjectURL(file),edit=URL.createObjectURL(blob);urls.push(orig,edit);const card=document.createElement('div');card.className='item';const title=document.createElement('h3');title.textContent=file.name;card.append(title);const pair=document.createElement('div');pair.className='pair';for(const [label,src] of [['Original',orig],['Mejorada',edit]]){const box=document.createElement('div'),text=document.createElement('small'),image=document.createElement('img');text.textContent=label;image.src=src;image.alt=label;box.append(text,image);pair.append(box)}card.append(pair);const link=document.createElement('a');link.className='download';link.href=edit;link.download='ventafacil-'+(n+1)+'.jpg';link.textContent='Descargar mejorada';card.append(link);out.append(card);done++}catch(err){const p=document.createElement('p');p.textContent='Error en '+file.name+': '+err.message;out.append(p)}}status.textContent=done+' de '+files.length+' procesadas';go.disabled=false};
</script></body></html>
